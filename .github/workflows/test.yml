name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache shadow-cljs deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: clj-${{ hashFiles('shadow-cljs.edn', 'deps.edn') }}
          restore-keys: clj-

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
