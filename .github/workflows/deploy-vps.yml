name: Deploy Demos to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
            demo-react/package-lock.json

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn', 'demo/deps.edn') }}
          restore-keys: clj-

      - name: Install root deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build npm library dist
        run: npm run release:library

      - name: Build CLJS demo
        working-directory: demo
        run: |
          npm ci
          npm run build

      - name: Build React demo
        working-directory: demo-react
        run: |
          npm ci
          npm run build

      - name: Package demo artifacts
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle/cljs deploy-bundle/react
          cp -R demo/dist/. deploy-bundle/cljs/
          cp -R demo-react/dist/. deploy-bundle/react/
          tar -czf jon-nested-menu-demos.tar.gz -C deploy-bundle .

      - name: Deploy through the restricted CI gate
        # The key can only run `deploy jon-nested-menu` on the server, which
        # replaces the demos folder with the uploaded plain files.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmoaMAZ9yKpppVl6J2NPsXsirLII1K5/FR47keXM215
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "vps $HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o HostKeyAlias=vps \
            -o StrictHostKeyChecking=yes "ci@$VPS_HOST" \
            deploy jon-nested-menu < jon-nested-menu-demos.tar.gz

      - name: Verify demos
        run: |
          set -eu
          for demo in cljs react; do
            curl -fsS --retry 5 --retry-delay 3 -o /dev/null \
              "https://jonramos.dev/demos/jon-nested-menu/$demo/"
          done
